<!DOCTYPE html>
<html lang="en" data-theme="dark" data-font="medium">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover makes env(safe-area-inset-*) work on notched phones.
         Pinch-zoom is left enabled (the old user-scalable=no blocked accessibility zoom).
         interactive-widget lets Android shrink the layout when the keyboard opens. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0b0d12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AirChat</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E✨%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/css/style.css?v=2">
</head>
<body>
    <!-- Login Modal -->
    <div id="login-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="login-title">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <div class="logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                </div>
                <h2 id="login-title">AirChat</h2>
                <p>Local network chat</p>
            </div>
            <input type="text" id="username-input" placeholder="Display name" aria-label="Display name"
                   autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="32" enterkeyhint="go" autofocus>
            <button type="button" class="btn-primary" onclick="joinChat()">Join chat</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="modal-content glass-panel">
            <h2 id="settings-title">Settings</h2>

            <div class="setting-group">
                <label for="theme-select">Theme</label>
                <select id="theme-select" onchange="applySettings()">
                    <option value="dark">🌙 Dark</option>
                    <option value="light">☀️ Light</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="font-select">Text size</label>
                <select id="font-select" onchange="applySettings()">
                    <option value="small">Small</option>
                    <option value="medium" selected>Medium</option>
                    <option value="large">Large</option>
                </select>
            </div>

            <div class="setting-group">
                <div class="setting-toggle-row">
                    <label for="sound-toggle">Sound</label>
                    <label class="switch" for="sound-toggle">
                        <input type="checkbox" id="sound-toggle" onchange="toggleSoundSetting(this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="setting-group">
                <div class="setting-toggle-row">
                    <label for="desktop-alerts-toggle">Desktop alerts</label>
                    <label class="switch" for="desktop-alerts-toggle">
                        <input type="checkbox" id="desktop-alerts-toggle" onchange="toggleDesktopAlerts(this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
                <p id="desktop-alerts-note" class="setting-note" style="display: none;">Desktop alerts need HTTPS or localhost. Sound, vibration and tab badge still work.</p>
            </div>

            <div class="setting-group">
                <button type="button" class="btn-secondary" onclick="toggleFullScreen()">Toggle full screen</button>
            </div>

            <button type="button" class="btn-primary mt-4" onclick="closeSettings()">Done</button>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" style="display: none;">
        <!-- Connection Status Pill -->
        <div id="connection-pill" class="connection-pill glass-panel" style="display: none;" aria-live="assertive">
            Reconnecting…
        </div>

        <!-- Floating Reaction Palette -->
        <div id="reaction-palette" class="reaction-palette glass-panel" style="display: none;" role="toolbar" aria-label="Reaction emojis">
            <button type="button" class="react-emoji-btn" data-emoji="👍" aria-label="Thumbs up">👍</button>
            <button type="button" class="react-emoji-btn" data-emoji="❤️" aria-label="Heart">❤️</button>
            <button type="button" class="react-emoji-btn" data-emoji="😂" aria-label="Laugh">😂</button>
            <button type="button" class="react-emoji-btn" data-emoji="😮" aria-label="Surprised">😮</button>
            <button type="button" class="react-emoji-btn" data-emoji="😢" aria-label="Cry">😢</button>
            <button type="button" class="react-emoji-btn" data-emoji="🔥" aria-label="Fire">🔥</button>
        </div>

        <!-- Mobile Overlay -->
        <div id="sidebar-overlay" onclick="toggleSidebar()" aria-hidden="true"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar" aria-label="Online users">
            <div class="sidebar-header">
                <h3>Online now</h3>
                <button type="button" class="icon-btn mobile-close-btn" onclick="toggleSidebar()" aria-label="Close sidebar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
            <ul id="user-list"></ul>
        </aside>

        <!-- Chat Area -->
        <div class="chat-container">
            <!-- Top Header -->
            <header class="chat-header">
                <button type="button" class="icon-btn mobile-menu-btn" onclick="toggleSidebar()" aria-label="Show online users">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
                </button>
                <div class="brand">AirChat</div>
                <div class="header-actions">
                    <button type="button" class="icon-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">☀️</button>
                    <button type="button" class="icon-btn" onclick="openSettings()" title="Settings" aria-label="Settings">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
                    </button>
                </div>
            </header>

            <!-- Messages Box (keep empty: the CSS empty-state relies on :empty) -->
            <div id="messages" role="log" aria-live="polite" aria-label="Messages"></div>

            <!-- Drop Overlay -->
            <div id="drop-overlay" class="drop-overlay" style="display: none;" aria-hidden="true">
                <div class="drop-card glass-panel">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <span>Drop to share (max 20 MB)</span>
                </div>
            </div>

            <!-- Upload Tray -->
            <div id="upload-tray" class="upload-tray" style="display: none;" aria-live="polite"></div>

            <!-- Typing Indicator -->
            <div id="typing-indicator" class="typing-indicator glass-panel" aria-hidden="true" style="display: none;">
                <span id="typing-text"></span>
                <span class="typing-dots">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </span>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <input type="file" id="file-input" multiple hidden>
                <button type="button" class="icon-btn" onclick="document.getElementById('file-input').click()" title="Attach file" aria-label="Attach file">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                </button>
                <button type="button" class="icon-btn hd-btn" id="hd-toggle" onclick="toggleHd()"
                        title="Send images in original quality (uses more data)" aria-label="Original quality HD toggle" aria-pressed="false">
                    HD
                </button>
                <input type="text" id="message-input" placeholder="Message" aria-label="Message"
                       autocomplete="off" maxlength="4000" enterkeyhint="send">
                <button type="button" class="send-btn" onclick="sendMessage()" aria-label="Send message">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                </button>
            </div>
        </div>

    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
